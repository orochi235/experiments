<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firehose — Field Review Lab</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f172a;
  --border: #2a3a5a;
  --text: #e0e0e0;
  --muted: #888;
  --accent: #7ec8e3;
  --approved: #48bb78;
  --flagged: #fc814a;
  --pending: #888;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

#app {
  display: flex;
  height: 100vh;
}

/* Layout variants applied by applyLayout() */
#app.layout-sidebar { flex-direction: row; }
#app.layout-topbar  { flex-direction: column; }
#app.layout-floating { flex-direction: column; }

#controls {
  background: var(--surface2);
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  overflow-y: auto;
}

/* Sidebar: fixed width column */
#app.layout-sidebar #controls {
  width: 220px;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Topbar: full-width row */
#app.layout-topbar #controls {
  width: 100%;
  border-right: none;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px 24px;
  overflow-y: visible;
}

/* Floating: hidden — managed by #floating-panel */
#app.layout-floating #controls { display: none; }

#field-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#status-bar {
  padding: 8px 16px;
  font-size: 12px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#progress-bar {
  height: 4px;
  background: var(--border);
  flex-shrink: 0;
}
#progress-bar .fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.1s;
}

#field-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

/* Floating panel overlay */
#floating-panel {
  position: fixed;
  bottom: 0;
  right: 0;
  z-index: 100;
}
#floating-toggle {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom: none;
  border-right: none;
  border-radius: 6px 0 0 0;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}
#floating-drawer {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom: none;
  border-right: none;
  padding: 14px;
  display: none;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px 24px;
  max-width: 700px;
  max-height: 300px;
  overflow-y: auto;
}
#floating-drawer.open { display: flex; }

/* Control panel axes */
.axis-group { display: flex; flex-direction: column; gap: 4px; }
#app.layout-topbar .axis-group { flex-direction: row; align-items: center; gap: 10px; }

.axis-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 2px;
}
#app.layout-topbar .axis-label { margin-bottom: 0; margin-right: 2px; }

.radio-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.radio-label input { accent-color: var(--accent); }

.reset-btn {
  margin-top: auto;
  padding: 6px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
}
.reset-btn:hover { background: rgba(255,255,255,0.1); }

/* Field rows */
.field-row {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s, border-color 0.1s;
}
.field-row:hover { border-color: var(--border); }

/* Density variants */
.density-compact .field-row  { padding: 4px 8px; font-size: 12px; margin-bottom: 2px; }
.density-comfortable .field-row { padding: 8px 12px; font-size: 13px; margin-bottom: 4px; }
.density-focused .field-row  { padding: 14px 16px; font-size: 15px; margin-bottom: 8px; }

/* State colors */
.field-row.state-approved { background: rgba(72,187,120,0.08); border-color: rgba(72,187,120,0.25); }
.field-row.state-flagged  { background: rgba(252,129,74,0.12); border-color: rgba(252,129,74,0.5); }
.field-row.state-pending  { background: rgba(255,255,255,0.03); }

.field-label { color: var(--muted); flex-shrink: 0; min-width: 180px; }
.density-compact    .field-label { min-width: 140px; }
.density-focused    .field-label { min-width: 220px; }

.field-value { flex: 1; }
.field-row.state-flagged .field-value { color: var(--flagged); }

.confidence-badge {
  font-size: 10px;
  color: var(--muted);
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  padding: 1px 4px;
  flex-shrink: 0;
}
.confidence-badge.low { color: var(--flagged); }

.flag-icon { color: var(--flagged); flex-shrink: 0; font-size: 12px; }

/* Cursor highlight (keyboard triage) */
.field-row.cursor {
  border-color: var(--accent) !important;
  background: rgba(126,200,227,0.1) !important;
}

/* Grouped mode */
.group-section { margin-bottom: 8px; }
.group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  margin-bottom: 4px;
  user-select: none;
}
.group-header:hover { border-color: var(--accent); }
.group-title { font-weight: 600; color: var(--accent); flex: 1; }
.group-count { color: var(--muted); }
.group-flagged { color: var(--flagged); }
.group-approve-btn {
  padding: 2px 8px;
  background: rgba(72,187,120,0.12);
  border: 1px solid rgba(72,187,120,0.3);
  border-radius: 3px;
  color: var(--approved);
  font-size: 11px;
  cursor: pointer;
}
.group-approve-btn:hover { background: rgba(72,187,120,0.25); }
.group-fields { padding-left: 4px; }
.group-section.collapsed .group-fields { display: none; }
</style>
</head>
