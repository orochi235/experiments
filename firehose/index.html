<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firehose — Field Review Lab</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f172a;
  --border: #2a3a5a;
  --text: #e0e0e0;
  --muted: #888;
  --accent: #7ec8e3;
  --approved: #48bb78;
  --flagged: #fc814a;
  --pending: #888;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

#app {
  display: flex;
  height: 100vh;
}

/* Layout variants applied by applyLayout() */
#app.layout-sidebar { flex-direction: row; }
#app.layout-topbar  { flex-direction: column; }
#app.layout-floating { flex-direction: column; }

#controls {
  background: var(--surface2);
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  overflow-y: auto;
}

/* Sidebar: fixed width column */
#app.layout-sidebar #controls {
  width: 220px;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Topbar: full-width row */
#app.layout-topbar #controls {
  width: 100%;
  border-right: none;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px 24px;
  overflow-y: visible;
}

/* Floating: hidden — managed by #floating-panel */
#app.layout-floating #controls { display: none; }

#field-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#status-bar {
  padding: 8px 16px;
  font-size: 12px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#progress-bar {
  height: 4px;
  background: var(--border);
  flex-shrink: 0;
}
#progress-bar .fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.1s;
}

#field-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

/* Floating panel overlay */
#floating-panel {
  position: fixed;
  bottom: 0;
  right: 0;
  z-index: 100;
}
#floating-toggle {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom: none;
  border-right: none;
  border-radius: 6px 0 0 0;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}
#floating-drawer {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom: none;
  border-right: none;
  padding: 14px;
  display: none;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px 24px;
  max-width: 700px;
  max-height: 300px;
  overflow-y: auto;
}
#floating-drawer.open { display: flex; }

/* Control panel axes */
.axis-group { display: flex; flex-direction: column; gap: 4px; }
#app.layout-topbar .axis-group { flex-direction: row; align-items: center; gap: 10px; }

.axis-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 2px;
}
#app.layout-topbar .axis-label { margin-bottom: 0; margin-right: 2px; }

.radio-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.radio-label input { accent-color: var(--accent); }

.reset-btn {
  margin-top: auto;
  padding: 6px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
}
.reset-btn:hover { background: rgba(255,255,255,0.1); }

/* Topbar: hide reset button (no room) and make axis groups inline */
#app.layout-topbar .reset-btn { display: none; }
#app.layout-topbar .axis-group { flex-direction: row; align-items: center; flex-wrap: nowrap; }
#app.layout-topbar .radio-label { font-size: 11px; }
#app.layout-topbar .axis-label { font-size: 9px; white-space: nowrap; }

/* Topbar sticky collapse: when field-list scrolls, topbar shrinks to summary */
#app.layout-topbar #controls {
  overflow: hidden;
  transition: max-height 0.2s, padding 0.2s;
  max-height: 80px;
}
#app.layout-topbar #controls.collapsed-bar {
  max-height: 32px;
  padding: 6px 16px;
  overflow: hidden;
}
#app.layout-topbar #controls.collapsed-bar .axis-group { display: none; }
#app.layout-topbar #controls.collapsed-bar::before {
  content: attr(data-summary);
  font-size: 11px;
  color: var(--muted);
}

/* Floating drawer sizing */
#floating-drawer {
  max-width: min(700px, 95vw);
}

/* Field rows */
.field-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s, border-color 0.1s;
}
.field-row:hover { border-color: var(--border); }

/* Density variants */
.density-compact .field-row  { padding: 4px 8px; font-size: 12px; margin-bottom: 2px; }
.density-comfortable .field-row { padding: 8px 12px; font-size: 13px; margin-bottom: 4px; }
.density-focused .field-row  { padding: 14px 16px; font-size: 15px; margin-bottom: 8px; }

/* State colors */
.field-row.state-approved { background: rgba(72,187,120,0.08); border-color: rgba(72,187,120,0.25); }
.field-row.state-flagged  { background: rgba(252,129,74,0.12); border-color: rgba(252,129,74,0.5); }
.field-row.state-pending  { background: rgba(255,255,255,0.03); }

.field-label { color: var(--muted); flex-shrink: 0; min-width: 180px; }
.density-compact    .field-label { min-width: 140px; }
.density-focused    .field-label { min-width: 220px; }

.field-value { flex: 1; }
.field-row.state-flagged .field-value { color: var(--flagged); }

.confidence-badge {
  font-size: 10px;
  color: var(--muted);
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  padding: 1px 4px;
  flex-shrink: 0;
}
.confidence-badge.low { color: var(--flagged); }

.flag-icon { color: var(--flagged); flex-shrink: 0; font-size: 12px; }

/* Cursor highlight (keyboard triage) */
.field-row.cursor {
  border-color: var(--accent) !important;
  background: rgba(126,200,227,0.1) !important;
}

/* Grouped mode */
.group-section { margin-bottom: 8px; }
.group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  margin-bottom: 4px;
  user-select: none;
}
.group-header:hover { border-color: var(--accent); }
.group-title { font-weight: 600; color: var(--accent); flex: 1; }
.group-count { color: var(--muted); }
.group-flagged { color: var(--flagged); }
.group-approve-btn {
  padding: 2px 8px;
  background: rgba(72,187,120,0.12);
  border: 1px solid rgba(72,187,120,0.3);
  border-radius: 3px;
  color: var(--approved);
  font-size: 11px;
  cursor: pointer;
}
.group-approve-btn:hover { background: rgba(72,187,120,0.25); }
.group-fields { padding-left: 4px; }
.group-section.collapsed .group-fields { display: none; }

/* Card renderer */
.field-card {
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s, border-color 0.1s;
  padding: 12px 16px;
  margin-bottom: 8px;
}
.field-card:hover { border-color: var(--border); }
.field-card.state-approved { background: rgba(72,187,120,0.08); border-color: rgba(72,187,120,0.25); }
.field-card.state-flagged  { background: rgba(252,129,74,0.12); border-color: rgba(252,129,74,0.5); }
.field-card.state-pending  { background: rgba(255,255,255,0.03); }
.field-card.cursor { border-color: var(--accent) !important; background: rgba(126,200,227,0.1) !important; }
.field-card-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.field-card-value { font-size: 15px; color: var(--text); }
.field-card.state-flagged .field-card-value { color: var(--flagged); }

/* Context annotations */
.field-context {
  font-size: 10px;
  color: #555;
  margin-bottom: 4px;
  line-height: 1.4;
  width: 100%;
}
</style>
</head>

// === HELPERS ===
function heatColor(confidence) {
  const t = Math.max(0, (0.75 - confidence) / 0.35); // 0 at conf≥0.75, 1 at conf=0.4
  return `rgba(252, 129, 74, ${(t * 0.28).toFixed(2)})`;
}

function getRendererProps(field, isCursor) {
  const props = {
    field,
    fieldState: state.fieldStates[field.id],
    isCursor,
    onDecide(newState) {
      state.fieldStates[field.id] = newState;
      renderFieldList();
      renderStatusBar();
    },
  };
  if (state.context === 'neighbors') {
    const idx = FIELDS.indexOf(field);
    props.neighbors = {
      prev: idx > 0 ? FIELDS[idx - 1] : null,
      next: idx < FIELDS.length - 1 ? FIELDS[idx + 1] : null,
    };
  }
  if (state.context === 'source') {
    props.source = field.category;
  }
  return props;
}

function renderRow(props) {
  const { field, fieldState, isCursor, neighbors, source } = props;
  const heatStyle = state.errorVisibility === 'heat'
    ? `background-color:${heatColor(field.confidence)};` : '';
  const pct = Math.round(field.confidence * 100);
  const badgeClass = field.confidence < 0.7 ? 'confidence-badge low' : 'confidence-badge';
  const badge = state.errorVisibility === 'confidence'
    ? `<span class="${badgeClass}">${pct}%</span>` : '';
  const flag = fieldState === 'flagged' ? '<span class="flag-icon">⚑</span>' : '';
  const cursorClass = isCursor ? ' cursor' : '';
  let ctx = '';
  if (neighbors) {
    const p = neighbors.prev ? neighbors.prev.label : '—';
    const n = neighbors.next ? neighbors.next.label : '—';
    ctx = `<div class="field-context">↑ ${p} &nbsp;·&nbsp; ↓ ${n}</div>`;
  } else if (source) {
    ctx = `<div class="field-context">§ ${source}</div>`;
  }
  return `<div class="field-row state-${fieldState}${cursorClass}" data-id="${field.id}" style="${heatStyle}" onclick="onFieldClick(${field.id})">
    ${ctx}<span class="field-label">${field.label}</span><span class="field-value">${field.value}</span>${badge}${flag}
  </div>`;
}

function renderCard(props) {
  const { field, fieldState, isCursor, neighbors, source } = props;
  const heatStyle = state.errorVisibility === 'heat'
    ? `background-color:${heatColor(field.confidence)};` : '';
  const pct = Math.round(field.confidence * 100);
  const badgeClass = field.confidence < 0.7 ? 'confidence-badge low' : 'confidence-badge';
  const badge = state.errorVisibility === 'confidence'
    ? `<span class="${badgeClass}">${pct}%</span>` : '';
  const flag = fieldState === 'flagged' ? '<span class="flag-icon">⚑</span>' : '';
  const cursorClass = isCursor ? ' cursor' : '';
  let ctx = '';
  if (neighbors) {
    const p = neighbors.prev ? neighbors.prev.label : '—';
    const n = neighbors.next ? neighbors.next.label : '—';
    ctx = `<div class="field-context">↑ ${p} &nbsp;·&nbsp; ↓ ${n}</div>`;
  } else if (source) {
    ctx = `<div class="field-context">§ ${source}</div>`;
  }
  return `<div class="field-card state-${fieldState}${cursorClass}" data-id="${field.id}" style="${heatStyle}" onclick="onFieldClick(${field.id})">
    ${ctx}<div class="field-card-label">${field.label}${badge}${flag}</div>
    <div class="field-card-value">${field.value}</div>
  </div>`;
}

function renderField(field, isCursor) {
  const props = getRendererProps(field, isCursor);
  return state.presentation === 'card' ? renderCard(props) : renderRow(props);
}

// === STATUS BAR ===
function renderStatusBar() {
  const approved = FIELDS.filter(f => state.fieldStates[f.id] === 'approved').length;
  const flagged  = FIELDS.filter(f => state.fieldStates[f.id] === 'flagged').length;
  const pending  = FIELDS.filter(f => state.fieldStates[f.id] === 'pending').length;
  const parts = [`${FIELDS.length} fields`];
  if (flagged)  parts.push(`<span style="color:var(--flagged)">${flagged} flagged</span>`);
  if (approved) parts.push(`<span style="color:var(--approved)">${approved} approved</span>`);
  if (pending)  parts.push(`${pending} pending`);
  document.getElementById('status-bar').innerHTML = parts.join(' · ');
}

// === PROGRESS BAR ===
function renderProgressBar() {
  const bar = document.getElementById('progress-bar');
  if (state.navigation === 'free') { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const pct = Math.round(((state.cursor + 1) / FIELDS.length) * 100);
  bar.querySelector('.fill').style.width = pct + '%';
}

// === FIELD LIST ===
function renderFieldList() {
  const list = document.getElementById('field-list');
  list.className = '';

  const hasCursor = state.navigation !== 'free';
  const fields = getVisibleFields();

  if (state.grouping === 'by-category') {
    list.innerHTML = buildGroupedView(FIELDS); // grouping always shows all
  } else {
    list.innerHTML = fields.map(f => {
      const isCursor = hasCursor && FIELDS.indexOf(f) === state.cursor;
      return renderField(f, isCursor);
    }).join('');
  }

  if (hasCursor) scrollCursorIntoView();
}

// Placeholders — implemented in later tasks
function buildGroupedView(fields) {
  const categories = [...new Set(fields.map(f => f.category))];

  return categories.map(cat => {
    const catFields = fields.filter(f => f.category === cat);
    const flaggedCount = catFields.filter(f => state.fieldStates[f.id] === 'flagged').length;
    const isCollapsed = state.collapsedGroups.has(cat);

    const flaggedBadge = flaggedCount > 0
      ? `<span class="group-flagged">⚑ ${flaggedCount}</span>`
      : '';

    return `<div class="group-section${isCollapsed ? ' collapsed' : ''}">
      <div class="group-header" data-category="${cat}" onclick="toggleGroup(this.dataset.category)">
        <span class="group-title">${cat}</span>
        <span class="group-count">${catFields.length} fields</span>
        ${flaggedBadge}
        <button class="group-approve-btn" data-category="${cat}" onclick="event.stopPropagation(); approveGroup(this.dataset.category)">Approve All</button>
      </div>
      <div class="group-fields density-${state.density}">
        ${catFields.map(f => renderField(f, false)).join('')}
      </div>
    </div>`;
  }).join('');
}
function scrollCursorIntoView() {
  setTimeout(() => {
    const el = document.querySelector('.field-row.cursor');
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 0);
}

function getVisibleFields() {
  if (state.visibility === 'one') {
    return FIELDS[state.cursor] ? [FIELDS[state.cursor]] : [];
  }
  if (state.visibility === 'windowed') {
    const half = 3;
    const start = Math.max(0, state.cursor - half);
    const end = Math.min(FIELDS.length, start + 7);
    return FIELDS.slice(start, end);
  }
  return FIELDS; // 'all'
}

function moveCursor(delta) {
  state.cursor = Math.max(0, Math.min(FIELDS.length - 1, state.cursor + delta));
  renderProgressBar();
  renderFieldList();
}

// === CONTROLS ===
function buildAxisGroup(key, label, options) {
  return `<div class="axis-group">
    <div class="axis-label">${label}</div>
    ${options.map(o => `<label class="radio-label">
      <input type="radio" name="${key}" value="${o.v}" ${state[key] === o.v ? 'checked' : ''}
        onchange="onAxisChange('${key}','${o.v}')"> ${o.l}
    </label>`).join('')}
  </div>`;
}

function buildControlsHTML() {
  return [
    buildAxisGroup('datasetId', 'Dataset', DATASETS.map(d => ({v: d.id, l: d.name}))),
    buildAxisGroup('visibility', 'Visibility', [
      {v:'all',      l:'All'},
      {v:'windowed', l:'Windowed'},
      {v:'one',      l:'One'},
    ]),
    buildAxisGroup('navigation', 'Navigation', [
      {v:'free',   l:'Free'},
      {v:'cursor', l:'Cursor'},
      {v:'auto',   l:'Auto'},
    ]),
    buildAxisGroup('approval', 'Approval', [
      {v:'click-cycle', l:'Click-cycle'},
      {v:'keyboard',    l:'Keyboard'},
      {v:'swipe',       l:'Swipe'},
      {v:'bulk',        l:'Bulk'},
    ]),
    buildAxisGroup('grouping', 'Grouping', [
      {v:'flat',        l:'Flat'},
      {v:'by-category', l:'By Category'},
    ]),
    buildAxisGroup('context', 'Context', [
      {v:'none',      l:'None'},
      {v:'neighbors', l:'Neighbors'},
      {v:'source',    l:'Source'},
    ]),
    buildAxisGroup('presentation', 'Presentation', [
      {v:'row',  l:'Row'},
      {v:'card', l:'Card'},
    ]),
    buildAxisGroup('defaultState', 'Default State', [
      {v:'approved', l:'All Approved'},
      {v:'pending',  l:'All Pending'},
    ]),
    buildAxisGroup('errorVisibility', 'Error Visibility', [
      {v:'none',       l:'None'},
      {v:'confidence', l:'Confidence'},
      {v:'heat',       l:'Color Heat'},
    ]),
    buildAxisGroup('controlLayout', 'Panel Layout', [
      {v:'sidebar',  l:'Sidebar'},
      {v:'topbar',   l:'Top Bar'},
      {v:'floating', l:'Floating'},
    ]),
    `<button class="reset-btn" onclick="resetFieldStates()">Reset field states</button>`,
  ].join('');
}

function renderControls() {
  document.getElementById('controls').innerHTML = buildControlsHTML();
  // Floating drawer gets the same controls
  const drawer = document.getElementById('floating-drawer');
  if (drawer) drawer.innerHTML = buildControlsHTML();
}

// === LAYOUT ===
function applyLayout() {
  const app = document.getElementById('app');
  app.className = `layout-${state.controlLayout}`;
  const fp = document.getElementById('floating-panel');
  fp.style.display = state.controlLayout === 'floating' ? 'block' : 'none';
}

// === RENDER ===
function render() {
  applyLayout();
  renderControls();
  renderStatusBar();
  renderProgressBar();
  renderFieldList();
}

// === EVENT HANDLERS ===
function onFieldClick(id) {
  if (state.interactionMode === 'keyboard-triage') return; // keyboard only in triage
  cycleFieldState(id);
}

function cycleFieldState(id) {
  const next = { pending: 'approved', approved: 'flagged', flagged: 'pending' };
  state.fieldStates[id] = next[state.fieldStates[id]];
  renderFieldList();
  renderStatusBar();
}

function onAxisChange(key, value) {
  if (key === 'datasetId') {
    state[key] = value;
    FIELDS = DATASETS.find(d => d.id === value).fields;
    state.cursor = 0;
    state.collapsedGroups = new Set();
    initFieldStates();
  } else if (key === 'defaultState') {
    state[key] = value;
    initFieldStates();
  } else {
    state[key] = value;
    if (key === 'navigation' || key === 'visibility') state.cursor = 0;
  }
  render();
}

function resetFieldStates() {
  initFieldStates();
  state.cursor = 0;
  render();
}

function toggleGroup(category) {
  if (state.collapsedGroups.has(category)) {
    state.collapsedGroups.delete(category);
  } else {
    state.collapsedGroups.add(category);
  }
  renderFieldList();
}

function approveGroup(category) {
  FIELDS.filter(f => f.category === category).forEach(f => {
    if (state.fieldStates[f.id] === 'pending') state.fieldStates[f.id] = 'approved';
  });
  renderFieldList();
  renderStatusBar();
}

function toggleFloating() {
  state.floatingOpen = !state.floatingOpen;
  document.getElementById('floating-drawer').classList.toggle('open', state.floatingOpen);
}

// === KEYBOARD ===
document.addEventListener('keydown', handleKeyDown);
function handleKeyDown(e) {
  // Don't fire if focus is on an input
  if (e.target.tagName === 'INPUT') return;

  if (state.interactionMode === 'scroll-flag') {
    if (e.key === 'a' || e.key === 'A') { approveAll(); e.preventDefault(); }
    if (e.key === 'F' && e.shiftKey) { jumpToNextFlagged(); e.preventDefault(); }
  }
  if (state.interactionMode === 'keyboard-triage') {
    if (e.key === ' ')           { triageAction('approved'); e.preventDefault(); }
    if (e.key === 'f' || e.key === 'F') { triageAction('flagged');  e.preventDefault(); }
    if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'J') { triageAdvance(); e.preventDefault(); }
    if (e.key === 'ArrowUp'   || e.key === 'k' || e.key === 'K') { triageBack();    e.preventDefault(); }
  }
}

function approveAll() {
  FIELDS.forEach(f => {
    if (state.fieldStates[f.id] === 'pending') state.fieldStates[f.id] = 'approved';
  });
  renderFieldList();
  renderStatusBar();
}

function jumpToNextFlagged() {
  const idx = FIELDS.findIndex(f => state.fieldStates[f.id] === 'flagged');
  if (idx === -1) return;
  const rows = document.querySelectorAll('.field-row');
  if (rows[idx]) rows[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function triageAction(newState) {
  const field = FIELDS[state.cursor];
  if (!field) return;
  state.fieldStates[field.id] = newState;
  triageAdvance();
}

function triageAdvance() {
  if (state.cursor < FIELDS.length - 1) state.cursor++;
  renderProgressBar();
  renderFieldList();
}

function triageBack() {
  if (state.cursor > 0) state.cursor--;
  renderProgressBar();
  renderFieldList();
}

// === BOOT ===
initFieldStates();

// Topbar collapse on scroll
document.getElementById('field-list').addEventListener('scroll', function() {
  const controls = document.getElementById('controls');
  if (state.controlLayout !== 'topbar') return;
  const scrolled = this.scrollTop > 20;
  controls.classList.toggle('collapsed-bar', scrolled);
  if (scrolled) {
    const summary = [state.interactionMode, state.density, state.defaultState,
      state.errorVisibility].join(' · ');
    controls.setAttribute('data-summary', summary);
  } else {
    controls.removeAttribute('data-summary');
  }
});

render();
</script>
</body>
</html>
