<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Speech Balloon Lab — Layers Palette (codepen scratch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #02020a;
    --bg-1: #0a0a18;
    --panel: rgba(22, 33, 62, 0.55);
    --panel-border: rgba(255, 255, 255, 0.06);
    --fg: #e6e7ec;
    --fg-muted: #aaa;
    --fg-dim: #888;
    --accent: #7ec8e3;
    --radius-sm: 6px;
    --radius-md: 10px;
    --font-display: 'Oswald', 'IBM Plex Mono', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--fg);
    background:
      radial-gradient(ellipse 60% 80% at 18% 30%, rgba(150, 80, 200, 0.22), transparent 70%),
      radial-gradient(ellipse 55% 90% at 78% 70%, rgba(220, 100, 140, 0.16), transparent 65%),
      radial-gradient(ellipse 50% 70% at 50% 50%, rgba(60, 110, 200, 0.18), transparent 75%),
      radial-gradient(ellipse at center, var(--bg-1) 0%, var(--bg-0) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 32px;
    display: grid;
    grid-template-columns: 320px 320px;
    gap: 32px;
    justify-content: center;
    align-items: start;
  }

  /* ── Side panel ─────────────────────────────────────────── */
  .side-panel {
    background: rgba(0, 0, 0, 0.25);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-radius: var(--radius-md);
    border: 1px solid var(--panel-border);
  }

  /* ── Section title (above add palette) ──────────────────── */
  .layer-stack-title {
    font: 300 1.05rem/1.2 var(--font-display);
    color: #fff;
    letter-spacing: 0.01em;
    margin-top: 10px;
    padding: 0 4px;
  }
  .side-panel > .layer-stack-title:first-child { margin-top: 0; }

  /* ── Add palette ────────────────────────────────────────── */
  .layers-add {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 10px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px dashed var(--panel-border);
    border-radius: var(--radius-sm);
  }
  .layers-add-label {
    font: 500 0.72rem/1 var(--font-display);
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .add-layer-btn {
    background: rgba(126, 200, 227, 0.08);
    color: var(--accent);
    border: 1px solid rgba(126, 200, 227, 0.3);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font: 400 0.78rem/1 var(--font-sans);
    cursor: pointer;
  }
  .add-layer-btn:hover { background: rgba(126, 200, 227, 0.2); }

  /* ── Body section (right panel header block) ────────────── */
  .panel-section {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .panel-section h2 {
    font: 300 1.05rem/1.2 var(--font-display);
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 0.01em;
  }

  /* ── Effect card ────────────────────────────────────────── */
  .effect-card {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .effect-card.is-expanded { background: rgba(0, 0, 0, 0.3); }

  .effect-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    user-select: none;
  }
  .effect-head:hover { background: rgba(255, 255, 255, 0.03); }

  .drag-handle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-dim);
    cursor: grab;
    padding: 0 2px;
  }
  .effect-head .caret {
    color: var(--fg-muted);
    font-size: 0.8rem;
    width: 12px;
    text-align: center;
  }
  .effect-kind {
    font: 500 0.82rem/1 var(--font-display);
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .effect-summary {
    font: 400 0.75rem/1 var(--font-sans);
    color: var(--fg-dim);
    margin-left: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .card-remove {
    background: transparent;
    color: var(--fg-muted);
    border: 1px solid transparent;
    border-radius: 4px;
    width: 22px;
    height: 22px;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .card-remove:hover {
    color: #ffb3a8;
    border-color: rgba(240, 68, 56, 0.4);
    background: rgba(240, 68, 56, 0.08);
  }

  .effect-body {
    padding: 4px 12px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 10px;
    row-gap: 10px;
    border-top: 1px solid var(--panel-border);
  }
  .effect-body > :not(.field.color) { grid-column: 1 / -1; }

  /* ── Fields ─────────────────────────────────────────────── */
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field > span {
    font: 300 0.78rem/1.2 var(--font-display);
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field > span em {
    font-style: normal;
    font-weight: 500;
    color: var(--accent);
    margin-left: auto;
  }
  .field select, .field input[type=text] {
    background: rgba(0, 0, 0, 0.35);
    color: var(--fg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    font: 400 0.85rem/1 var(--font-sans);
  }
  .field.color {
    flex-direction: row;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .field.color > span { flex: 1; min-width: 0; }
  .field.color input[type=color] {
    width: 36px; height: 24px;
    background: transparent;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 2px;
    cursor: pointer;
    flex-shrink: 0;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    background: transparent;
    height: 18px;
    cursor: pointer;
    width: 100%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: rgba(126, 200, 227, 0.18);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    margin-top: -4px;
  }
  h3 {
    font: 500 0.72rem/1 var(--font-display);
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 10px 0 4px;
  }
</style>
</head>
<body>

<!-- LEFT panel: Fill -->
<aside class="side-panel">
  <h2 class="layer-stack-title">Fill</h2>
  <div class="layers-add">
    <span class="layers-add-label">+ Layer</span>
    <button class="add-layer-btn">fill</button>
  </div>

  <!-- Collapsed card -->
  <div class="effect-card is-collapsed">
    <div class="effect-head">
      <span class="drag-handle" title="Drag to reorder">
        <svg width="12" height="16" viewBox="0 0 8 16" fill="currentColor">
          <circle cx="2" cy="3" r="1.1" /><circle cx="6" cy="3" r="1.1" />
          <circle cx="2" cy="8" r="1.1" /><circle cx="6" cy="8" r="1.1" />
          <circle cx="2" cy="13" r="1.1" /><circle cx="6" cy="13" r="1.1" />
        </svg>
      </span>
      <span class="caret">▸</span>
      <span class="effect-kind">fill</span>
      <span class="effect-summary">radial · #ffffff</span>
      <button class="card-remove" title="Remove layer">✕</button>
    </div>
  </div>
</aside>

<!-- RIGHT panel: Body + Effects -->
<aside class="side-panel">
  <!-- Body section (panel-section, kept as-is) -->
  <div class="panel-section">
    <h2>Body</h2>
    <p style="font-size:0.78rem; color: var(--fg-dim);">(body controls here — not the focus of this scratch pad)</p>
  </div>

  <h2 class="layer-stack-title">Effects</h2>
  <div class="layers-add">
    <span class="layers-add-label">+ Layer</span>
    <button class="add-layer-btn">tail</button>
    <button class="add-layer-btn">stroke</button>
    <button class="add-layer-btn">shadow</button>
  </div>

  <!-- Expanded card with various field types -->
  <div class="effect-card is-expanded">
    <div class="effect-head">
      <span class="drag-handle">
        <svg width="12" height="16" viewBox="0 0 8 16" fill="currentColor">
          <circle cx="2" cy="3" r="1.1" /><circle cx="6" cy="3" r="1.1" />
          <circle cx="2" cy="8" r="1.1" /><circle cx="6" cy="8" r="1.1" />
          <circle cx="2" cy="13" r="1.1" /><circle cx="6" cy="13" r="1.1" />
        </svg>
      </span>
      <span class="caret">▾</span>
      <span class="effect-kind">tail</span>
      <span class="effect-summary">classic · 115°</span>
      <button class="card-remove">✕</button>
    </div>
    <div class="effect-body">
      <label class="field">
        <span>Shape</span>
        <select><option>classic</option><option>bubbles</option><option>lightning</option></select>
      </label>
      <h3>Attachment</h3>
      <label class="field">
        <span>Angle <em>115</em></span>
        <input type="range" min="0" max="359" step="1" value="115">
      </label>
      <label class="field">
        <span>Projection</span>
        <select><option>radial</option><option>side</option></select>
      </label>
      <label class="field">
        <span>Offset along perimeter <em>0.00</em></span>
        <input type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <label class="field">
        <span>Radial offset <em>0</em></span>
        <input type="range" min="-40" max="60" step="0.5" value="0">
      </label>
      <h3>Shape</h3>
      <label class="field">
        <span>Length <em>50</em></span>
        <input type="range" min="6" max="200" step="0.5" value="50">
      </label>
      <label class="field">
        <span>Base width <em>40</em></span>
        <input type="range" min="2" max="160" step="0.5" value="40">
      </label>
    </div>
  </div>

  <!-- Collapsed stroke card -->
  <div class="effect-card is-collapsed">
    <div class="effect-head">
      <span class="drag-handle">
        <svg width="12" height="16" viewBox="0 0 8 16" fill="currentColor">
          <circle cx="2" cy="3" r="1.1" /><circle cx="6" cy="3" r="1.1" />
          <circle cx="2" cy="8" r="1.1" /><circle cx="6" cy="8" r="1.1" />
          <circle cx="2" cy="13" r="1.1" /><circle cx="6" cy="13" r="1.1" />
        </svg>
      </span>
      <span class="caret">▸</span>
      <span class="effect-kind">stroke</span>
      <span class="effect-summary">2px · #161921</span>
      <button class="card-remove">✕</button>
    </div>
  </div>

  <!-- Expanded card with doubled-up color swatches -->
  <div class="effect-card is-expanded">
    <div class="effect-head">
      <span class="drag-handle">
        <svg width="12" height="16" viewBox="0 0 8 16" fill="currentColor">
          <circle cx="2" cy="3" r="1.1" /><circle cx="6" cy="3" r="1.1" />
          <circle cx="2" cy="8" r="1.1" /><circle cx="6" cy="8" r="1.1" />
          <circle cx="2" cy="13" r="1.1" /><circle cx="6" cy="13" r="1.1" />
        </svg>
      </span>
      <span class="caret">▾</span>
      <span class="effect-kind">shadow</span>
      <span class="effect-summary">4,8 · blur 10</span>
      <button class="card-remove">✕</button>
    </div>
    <div class="effect-body">
      <label class="field color">
        <span>Highlight tint</span>
        <input type="color" value="#ffffff">
      </label>
      <label class="field color">
        <span>Shadow tint</span>
        <input type="color" value="#000000">
      </label>
      <label class="field">
        <span>Offset X <em>4</em></span>
        <input type="range" min="-20" max="20" step="0.5" value="4">
      </label>
      <label class="field">
        <span>Offset Y <em>8</em></span>
        <input type="range" min="-20" max="20" step="0.5" value="8">
      </label>
    </div>
  </div>
</aside>

</body>
</html>
