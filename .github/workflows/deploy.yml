name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: interstellar-tourism/package-lock.json

      # Install: keep NODE_ENV unset here so devDependencies (vite, etc.) are
      # actually installed. npm ci with NODE_ENV=production silently skips them.
      - name: Install interstellar-tourism deps
        working-directory: interstellar-tourism
        run: npm ci

      # Build: NODE_ENV=production triggers the base-path branch in
      # vite.config.js.
      - name: Build interstellar-tourism
        working-directory: interstellar-tourism
        env:
          NODE_ENV: production
        run: npm run build

      # Assemble the Pages artifact: everything in the repo root EXCEPT the
      # vite source dir, with the built dist/ mapped to interstellar-tourism/.
      - name: Assemble artifact
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='.git' --exclude='.github' \
                --exclude='interstellar-tourism' --exclude='sky-color-gl' \
                ./ _site/
          mkdir -p _site/interstellar-tourism
          cp -r interstellar-tourism/dist/. _site/interstellar-tourism/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
