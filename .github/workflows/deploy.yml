name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # speech-balloons depends on @weasel-js/labkit as a
      # file:../../weasel/packages/labkit sibling (labkit lives inside the
      # weasel monorepo since 2026-06). Recreate the ~/src sibling layout by
      # cloning weasel next to the workspace; it tracks its main branch.
      - name: Clone sibling kit (weasel)
        run: |
          rm -rf ../weasel
          git clone --depth 1 https://github.com/orochi235/weasel.git ../weasel

      # Node ≥23 strips types natively — speech-balloons' vite config
      # dynamically imports weasel's vite-aliases.ts (raw TS) at config-load
      # time, which node 20 cannot load. 24 matches the local toolchain
      # closely enough (local is 26) while being the runner's LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            interstellar-horizons/package-lock.json
            speech-balloons/package-lock.json

      # Install: keep NODE_ENV unset here so devDependencies (vite, etc.) are
      # actually installed. npm ci with NODE_ENV=production silently skips them.
      # weasel's root install covers all workspaces, including packages/labkit.
      - name: Install weasel deps
        working-directory: ../weasel
        run: npm ci

      # speech-balloons consumes labkit's dist/ (vite serves it as-is rather
      # than pre-bundling), and dist/ is gitignored — build it before the app.
      - name: Build labkit
        working-directory: ../weasel
        run: npm run build -w @weasel-js/labkit

      - name: Install interstellar-horizons deps
        working-directory: interstellar-horizons
        run: npm ci

      - name: Install speech-balloons deps
        working-directory: speech-balloons
        run: npm ci

      # Build: NODE_ENV=production triggers the base-path branch in
      # each experiment's vite.config.
      - name: Build interstellar-horizons
        working-directory: interstellar-horizons
        env:
          NODE_ENV: production
        run: npm run build

      - name: Build speech-balloons
        working-directory: speech-balloons
        env:
          NODE_ENV: production
        run: npm run build

      # Assemble the Pages artifact: every top-level entry EXCEPT the vite
      # source dirs, the legacy sky-color-gl dir, and the usual git/CI dirs;
      # then drop each experiment's built dist into the corresponding
      # _site/<experiment>/ folder.
      - name: Assemble artifact
        run: |
          mkdir -p _site
          shopt -s dotglob
          for item in *; do
            case "$item" in
              _site|interstellar-horizons|speech-balloons|sky-color-gl) continue ;;
            esac
            cp -r "$item" _site/
          done
          mkdir -p _site/interstellar-horizons
          cp -rT interstellar-horizons/dist _site/interstellar-horizons
          mkdir -p _site/speech-balloons
          cp -rT speech-balloons/dist _site/speech-balloons
          echo "--- assembled _site ---"
          find _site -maxdepth 3 -type d | sort
          echo "--- _site/speech-balloons ---"
          ls -la _site/speech-balloons
          echo "--- head of deployed speech-balloons index.html ---"
          head -12 _site/speech-balloons/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
